name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: amdb
            asset_name: amdb-linux-amd64.tar.gz
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: amdb
            asset_name: amdb-macos-aarch64.tar.gz
            use_cross: false

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: amdb
            asset_name: amdb-macos-amd64.tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: amdb.exe
            asset_name: amdb-windows-amd64.zip
            use_cross: false

    steps:
      # 🔥 [추가됨] Windows 긴 경로 에러 방지 (Tree-sitter 빌드 필수 설정)
      - name: Enable Long Paths
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --verbose --release --target ${{ matrix.target }}

      # 📦 Linux/macOS 패키징
      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../..

      # 📦 Windows 패키징 (7z 사용)
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a -tzip ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
