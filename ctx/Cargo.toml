[package]
name = "ctx"
version = "0.1.0"
edition = "2021"
description = "The Context Protocol: AI Memory Standard"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
console = "0.15"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
notify = "6.1"
walkdir = "2.4"
tree-sitter = "0.20"
tree-sitter-python = "0.20"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"

[profile.release]
lto = true
strip = true
opt-level = 3