[package]
name = "amdb"
version = "0.2.1"
edition = "2021"
description = "Agent Memory Database - The Open Standard for AI Context Memory"
license = "MIT"
repository = "https://github.com/BETAER-08/amdb"
keywords = ["ai", "context", "memory", "database", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "amdb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
console = "0.15"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
notify = "6.1"
walkdir = "2.4"
tree-sitter = "0.23.0"
tree-sitter-rust = "0.23.0"
tree-sitter-python = "0.23.0"
tree-sitter-javascript = "0.23.0"
tree-sitter-typescript = "0.23.0"
tree-sitter-go = "0.23.0"
tree-sitter-c = "0.23.0"
tree-sitter-cpp = "0.23.0"
tree-sitter-java = "0.23.0"
tree-sitter-c-sharp = "0.23.0"
tree-sitter-ruby = "0.23.0"
tree-sitter-php = "0.23.1"
# tree-sitter-kotlin = "0.3.7"
# tree-sitter-swift = "0.6.2"
tree-sitter-scala = "0.23.2"
tree-sitter-haskell = "0.23.0"
# tree-sitter-lua = "0.2.0"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
regex = "1.10"
lazy_static = "1.4"
fastembed = "4"
ordered-float = "4.0"
toml = "0.8"
bincode = "1.3"

[profile.release]
lto = true
strip = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
