[package]
name = "amdb"
version = "0.1.0"
edition = "2021"
description = "Agent Memory Database - The Open Standard for AI Context Memory"
license = "MIT"
repository = "https://github.com/BETAER-08/amdb"
keywords = ["ai", "context", "memory", "database", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "amdb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
console = "0.15"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
notify = "6.1"
walkdir = "2.4"
tree-sitter = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
regex = "1.10"
lazy_static = "1.4"
fastembed = "4"
ordered-float = "4.0"
toml = "0.8"
bincode = "1.3"

[profile.release]
lto = true
strip = true
opt-level = 3