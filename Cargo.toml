[package]
name = "amdb"
version = "0.4.0"
edition = "2021"
description = "Turn your codebase into AI context. A high-performance context generator for LLMs (Cursor, Claude) using Tree-sitter and Vector Search."
license = "MIT"
repository = "https://github.com/BETAER-08/amdb"
keywords = ["llm", "context-generator", "ai-agent", "developer-tools", "code-analysis"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[[bin]]
name = "amdb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
console = "0.15"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
notify = "6.1"
rayon = "1.10"
ignore = "0.4"
tree-sitter = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-json = "0.23"
tree-sitter-bash = "0.23"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
lazy_static = "1.4"
fastembed = "4"
ordered-float = "4.0"
toml = "0.8"
bincode = "1.3"

[profile.release]
lto = true
strip = true
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"